name: Build Ai Fusion Camera APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Ultralytics YOLO11x and export INT8 TFLite
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install ultralytics tensorflow
          mkdir -p app/src/main/assets
          python - <<'PY'
          from ultralytics import YOLO

          model = YOLO('https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11x.pt')
          model.export(
              format='tflite',
              imgsz=640,
              int8=True,
              data='coco8.yaml'
          )
          PY
          TFLITE="$(find . -maxdepth 3 -type f -name 'yolo11x_full_integer_quant.tflite' -o -name 'yolo11x_integer_quant.tflite' | head -1)"
          if [ -z "$TFLITE" ]; then
            TFLITE="$(find . -type f -name '*yolo11x*.tflite' | head -1)"
          fi
          if [ -z "$TFLITE" ]; then
            echo 'INT8 TFLite model was not generated'
            exit 1
          fi
          cp "$TFLITE" app/src/main/assets/yolo11x_int8.tflite
          ls -lh app/src/main/assets/yolo11x_int8.tflite

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = \"([^\"]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-fusion-camera-v${{ steps.version.outputs.version }}-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Ai Fusion Camera v${VERSION}" --generate-notes
          fi
